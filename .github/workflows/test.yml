name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diabetes-predictor/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diabetes-predictor/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (ruff y pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diabetes-predictor/backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: diabetes-predictor/backend/requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest
        env:
          DATABASE_URL: sqlite:///./test.db
          MODEL_STUB_ENABLED: "true"

  migrations:
    name: Migraciones SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diabetes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      - name: Aplicar migraciones
        run: |
          for f in diabetes-predictor/database/migrations/*.sql; do
            echo "Aplicando $f"
            psql -h localhost -U postgres -d diabetes_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Cargar datos de prueba
        run: |
          psql -h localhost -U postgres -d diabetes_test -v ON_ERROR_STOP=1 -q \
            -f diabetes-predictor/database/seeds/001_datos_desarrollo.sql

      - name: Comprobar restricciones
        run: |
          # La suma de probabilidades debe quedar rechazada por el CHECK
          if psql -h localhost -U postgres -d diabetes_test -t -c \
            "INSERT INTO predictions (patient_id, resultado, probabilidad_tipo1, probabilidad_tipo2, probabilidad_gestacional, probabilidad_sano) SELECT id, 'sano', 0.9, 0.9, 0.9, 0.9 FROM patients LIMIT 1;" 2>/dev/null; then
            echo "ERROR: se aceptaron probabilidades que no suman 1"
            exit 1
          fi
          echo "Restriccion probabilidades_suman_uno activa"
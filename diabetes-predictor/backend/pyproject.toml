[project]
name = "diabetes-predictor-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "model", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "LOG", "BLE"]

# B008: Depends(get_db) en la firma de FastAPI es el idioma del framework, no un defecto
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"